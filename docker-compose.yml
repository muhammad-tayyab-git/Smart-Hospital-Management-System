services:
  mysql:
    image: mysql:8.4
    container_name: shms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_hospital
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-shms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - shms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: smart_hospital
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-shms_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      FLYWAY_ENABLED: "true"
      PORT: ${PORT:-8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

volumes:
  shms_mysql_data:
