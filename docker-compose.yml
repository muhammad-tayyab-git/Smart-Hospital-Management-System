services:
  mysql:
    image: mysql:8.4
    container_name: shms_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: smart_hospital
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

    ports:
      - "3307:3306"

    volumes:
      - shms_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: smart_hospital
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      PORT: ${PORT:-8080}

      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-60m}
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-never}

    ports:
      - "${PORT:-8080}:${PORT:-8080}"

volumes:
  shms_mysql_data: