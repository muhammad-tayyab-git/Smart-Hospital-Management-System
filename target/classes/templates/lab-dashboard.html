<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratory | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">LABORATORY</span><h1 class="page-title">Lab work queue</h1><p class="page-subtitle">Process orders, update status and record verified results.</p></div></div><div class="surface"><div class="surface-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Patient</th><th>Test</th><th>Priority</th><th>Status</th><th>Update</th><th>Result</th></tr></thead><tbody><tr th:each="o:${orders}"><td><strong th:text="${o.patient.fullName}">Patient</strong><div class="small text-muted" th:text="${o.patient.patientNumber}">PAT</div></td><td th:text="${o.testName}">CBC</td><td><span class="status-pill" th:text="${o.priority}">NORMAL</span></td><td><span class="status-pill info" th:text="${o.status}">ORDERED</span></td><td><form method="post" th:action="@{/lab/{id}/status(id=${o.id})}" class="d-flex gap-2"><select name="status" class="form-select form-select-sm"><option th:each="s:${T(com.shms.entity.LabOrder.Status).values()}" th:value="${s}" th:text="${s}" th:selected="${s==o.status}"></option></select><button class="btn btn-sm btn-primary">Save</button></form></td><td><form method="post" th:action="@{/lab/{id}/result(id=${o.id})}" class="d-flex gap-2"><input name="value" class="form-control form-control-sm" placeholder="Value" required><input name="unit" class="form-control form-control-sm" placeholder="Unit"><button class="btn btn-sm btn-success">Record</button></form></td></tr></tbody></table></div></div></div></div></main></body></html>
