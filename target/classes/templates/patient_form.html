<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patient | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:if="${session.currentUser?.role == 'ADMIN'}" th:replace="fragments/admin-header :: adminLayout"></div><div th:unless="${session.currentUser?.role == 'ADMIN'}" th:replace="fragments/header :: header"></div><main th:class="${session.currentUser?.role == 'ADMIN'} ? 'admin-content' : 'page-main'"><div th:class="${session.currentUser?.role == 'ADMIN'} ? '' : 'page-container'"><div class="page-header"><div><span class="eyebrow">Patient management</span><h1 class="page-title" th:text="${patient.id != null ? 'Edit patient' : 'Add patient'}">Add patient</h1><p class="page-subtitle">Keep identity and patient information accurate and up to date.</p></div><a th:href="@{/patients}" class="btn btn-light border"><i class="bi bi-arrow-left me-2"></i>Back</a></div><form th:action="${patient.id != null ? '/patients/update/' + patient.id : '/patients/add'}" method="post"><div class="row g-4"><div class="col-lg-7"><div class="surface surface-body"><div class="card-heading"><div><span class="section-kicker">Identity</span><h4>Account details</h4></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label">First name *</label><input name="firstName" class="form-control" th:value="${user.firstName}" required></div><div class="col-md-6"><label class="form-label">Last name *</label><input name="lastName" class="form-control" th:value="${user.lastName}" required></div><div class="col-md-6"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" th:value="${user.email}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" th:value="${user.phone}"></div><div class="col-12"><label class="form-label">Password</label><input type="password" name="password" class="form-control" th:placeholder="${patient.id != null ? 'Leave blank to keep current password' : 'Set a password'}" th:required="${patient.id == null}"></div></div></div></div><div class="col-lg-5"><div class="surface surface-body"><div class="card-heading"><div><span class="section-kicker">Patient profile</span><h4>Health information</h4></div></div><div class="mb-3"><label class="form-label">Date of birth</label><input type="date" name="dateOfBirth" class="form-control" th:value="${patient.dateOfBirth}"></div><div class="mb-3"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">Select</option><option value="MALE" th:selected="${patient.gender?.name() == 'MALE'}">Male</option><option value="FEMALE" th:selected="${patient.gender?.name() == 'FEMALE'}">Female</option><option value="OTHER" th:selected="${patient.gender?.name() == 'OTHER'}">Other</option><option value="PREFER_NOT_TO_SAY" th:selected="${patient.gender?.name() == 'PREFER_NOT_TO_SAY'}">Prefer not to say</option></select></div><div class="mb-3"><label class="form-label">Blood group</label><select name="bloodGroup" class="form-select"><option value="">Select</option><option value="A_POSITIVE" th:selected="${patient.bloodGroup?.name() == 'A_POSITIVE'}">A+</option><option value="A_NEGATIVE" th:selected="${patient.bloodGroup?.name() == 'A_NEGATIVE'}">A-</option><option value="B_POSITIVE" th:selected="${patient.bloodGroup?.name() == 'B_POSITIVE'}">B+</option><option value="B_NEGATIVE" th:selected="${patient.bloodGroup?.name() == 'B_NEGATIVE'}">B-</option><option value="AB_POSITIVE" th:selected="${patient.bloodGroup?.name() == 'AB_POSITIVE'}">AB+</option><option value="AB_NEGATIVE" th:selected="${patient.bloodGroup?.name() == 'AB_NEGATIVE'}">AB-</option><option value="O_POSITIVE" th:selected="${patient.bloodGroup?.name() == 'O_POSITIVE'}">O+</option><option value="O_NEGATIVE" th:selected="${patient.bloodGroup?.name() == 'O_NEGATIVE'}">O-</option></select></div><div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="3" th:text="${patient.address}"></textarea></div><div><label class="form-label">Allergies</label><textarea name="allergies" class="form-control" rows="3" th:text="${patient.allergies}"></textarea></div></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a th:href="@{/patients}" class="btn btn-light border">Cancel</a><button class="btn btn-primary"><i class="bi bi-check2 me-2"></i>Save patient</button></div></form></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
