<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Workspace | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="hero-panel mb-4"><div><span class="eyebrow text-white">STAFF WORKSPACE</span><h1 class="fw-bold mb-2">Welcome, <span th:text="${user.fullName}">Staff</span>.</h1><p class="mb-0 text-white-50">Your workspace is configured for the <strong th:text="${user.role}">ROLE</strong> team.</p></div></div><div class="row g-4"><div class="col-md-4"><div class="quick-card"><span class="quick-icon"><i class="bi bi-people"></i></span><h5>Patient care</h5><p>Access patient workflows allowed for your role.</p></div></div><div class="col-md-4"><div class="quick-card"><span class="quick-icon"><i class="bi bi-bell"></i></span><h5>Notifications</h5><p>System and hospital notifications can be surfaced here.</p></div></div><div class="col-md-4"><div class="quick-card"><span class="quick-icon"><i class="bi bi-clipboard2-check"></i></span><h5>Role tasks</h5><p>Use this workspace as the entry point for clinical operations.</p></div></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
