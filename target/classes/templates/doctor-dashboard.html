<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Dashboard | Smart Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container py-4 py-lg-5">
    <div class="hero-panel mb-4">
        <div><span class="eyebrow">DOCTOR PORTAL</span><h1 class="display-6 fw-bold mb-2">Dr. <span th:text="${doctor.fullName}">Doctor</span></h1><p class="mb-0 text-white-50" th:text="${doctor.specialization}">Specialization</p></div>
        <div class="text-lg-end"><div class="small text-white-50">Experience</div><strong th:text="${doctor.experience}">8 years</strong></div>
    </div>

    <div class="content-card">
        <div class="section-heading flex-wrap gap-3">
            <div><span class="eyebrow text-primary">SCHEDULE</span><h4>Appointment slots</h4></div>
            <form method="get" th:action="@{/doctors/dashboard}" class="d-flex gap-2">
                <input type="date" id="date" name="date" class="form-control" th:value="${selectedDate}">
                <button class="btn btn-primary"><i class="bi bi-search me-1"></i>View</button>
            </form>
        </div>

        <div th:if="${slots == null or slots.isEmpty()}" class="empty-state">
            <i class="bi bi-calendar2-x"></i><p>No slots available for this date.</p>
        </div>

        <div th:unless="${slots == null or slots.isEmpty()}" class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Time</th><th>Patient</th><th>Status</th><th class="text-end">Action</th></tr></thead>
                <tbody>
                <tr th:each="slot : ${slots}">
                    <td><strong th:text="${slot.startTime + ' – ' + slot.endTime}">09:00</strong></td>
                    <td th:text="${slot.patient != null ? slot.patient.fullName : 'Available'}">Available</td>
                    <td>
                        <span class="status-pill success" th:if="${slot.attended}">Attended</span>
                        <span class="status-pill warning" th:if="${slot.booked and !slot.attended}">Booked</span>
                        <span class="status-pill neutral" th:if="${!slot.booked}" th:text="${slot.available ? 'Available' : 'Disabled'}">Available</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${slot.booked and !slot.attended}" class="d-flex justify-content-end gap-2">
                            <button class="btn btn-sm btn-success" th:onclick="'markAttended(' + ${slot.id} + ')'"><i class="bi bi-check2 me-1"></i>Attended</button>
                            <button class="btn btn-sm btn-outline-danger" th:onclick="'cancelAppointment(' + ${slot.id} + ')'">Cancel</button>
                        </div>
                        <button th:if="${!slot.booked}" class="btn btn-sm"
                                th:classappend="${slot.available ? 'btn-outline-danger' : 'btn-outline-success'}"
                                th:text="${slot.available ? 'Disable' : 'Enable'}"
                                th:onclick="'toggleSlot(' + ${slot.id} + ')'">Disable</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
async function postAction(url){
    try{ const r=await axios.post(url); if(r.data==='success'){location.reload();} else {alert('The action could not be completed.');} }
    catch(e){console.error(e);alert('Server error. Please try again.');}
}
function toggleSlot(id){postAction('/doctors/toggle-slot/'+id)}
function markAttended(id){postAction('/doctors/mark-attended/'+id)}
function cancelAppointment(id){postAction('/doctors/cancel-appointment/'+id)}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
