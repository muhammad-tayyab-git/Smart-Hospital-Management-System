<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Bills | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">Patient portal</span><h1 class="page-title">My invoices</h1><p class="page-subtitle">Review your hospital charges and payment status.</p></div></div><div class="surface table-shell"><div th:if="${bills.isEmpty()}" class="empty-state"><div class="empty-icon"><i class="bi bi-receipt"></i></div><h5>No invoices yet</h5><p>Invoices generated for your care will appear here.</p></div><div th:unless="${bills.isEmpty()}" class="table-responsive"><table class="table"><thead><tr><th>Invoice</th><th>Description</th><th>Amount</th><th>Issue date</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="b : ${bills}"><td><strong th:text="${b.invoiceNumber}">INV</strong></td><td th:text="${b.description}">Hospital service</td><td><strong th:text="${b.totalAmount + ' €'}">0 €</strong></td><td th:text="${#temporals.format(b.issueDate,'dd MMM yyyy')}">Date</td><td><span class="status-pill success" th:if="${b.status.name() == 'PAID'}">Paid</span><span class="status-pill warning" th:if="${b.status.name() == 'PENDING' or b.status.name() == 'PARTIALLY_PAID'}" th:text="${b.status}">Pending</span><span class="status-pill danger" th:if="${b.status.name() == 'CANCELLED' or b.status.name() == 'OVERDUE'}" th:text="${b.status}">Cancelled</span></td><td class="text-end"><a th:href="@{/billing/view/{id}(id=${b.id})}" class="btn btn-sm btn-light border"><i class="bi bi-arrow-up-right"></i></a></td></tr></tbody></table></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
