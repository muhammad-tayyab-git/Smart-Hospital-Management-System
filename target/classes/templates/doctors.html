<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doctors | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:if="${session.currentUser != null and session.currentUser.role == 'ADMIN'}" th:replace="fragments/admin-header :: adminLayout"></div><div th:unless="${session.currentUser != null and session.currentUser.role == 'ADMIN'}" th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">Medical team</span><h1 class="page-title">Find your doctor</h1><p class="page-subtitle">Browse our specialists and choose an available doctor for your next consultation.</p></div><a th:if="${session.currentUser?.role == 'ADMIN'}" th:href="@{/doctors/addDoctor}" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Add doctor</a></div><div class="row g-4"><div class="col-md-6 col-xl-4" th:each="doctor : ${doctors}"><div class="surface p-3 h-100"><div class="p-3 rounded-4" style="background:linear-gradient(135deg,#eef4ff,#f7fbff)"><div class="d-flex align-items-center gap-3"><div class="person-avatar" style="width:58px;height:58px;border-radius:18px"><i class="bi bi-person-badge fs-4"></i></div><div class="flex-grow-1"><div class="person-name" th:text="${doctor.fullName}">Doctor</div><div class="person-meta" th:text="${doctor.specialization}">Specialization</div></div><span class="status-pill success" th:if="${doctor.active}">Available</span><span class="status-pill danger" th:unless="${doctor.active}">Unavailable</span></div></div><div class="p-3"><div class="d-flex justify-content-between mb-2"><span class="text-muted small">Department</span><strong class="small" th:text="${doctor.department.name}">Department</strong></div><div class="d-flex justify-content-between mb-2"><span class="text-muted small">Experience</span><strong class="small" th:text="${doctor.experience}">8 years</strong></div><div class="d-flex justify-content-between"><span class="text-muted small">Consultation</span><strong class="small" th:text="${doctor.consultationFee != null ? doctor.consultationFee + ' €' : 'Contact desk'}">50 €</strong></div></div><div class="d-flex gap-2 px-3 pb-3"><a th:if="${session.currentUser != null and session.currentUser.role == 'PATIENT' and doctor.active}" th:href="@{/appointments/book(doctorId=${doctor.id})}" class="btn btn-primary flex-grow-1"><i class="bi bi-calendar2-plus me-2"></i>Book</a><a th:if="${session.currentUser == null}" th:href="@{/login}" class="btn btn-outline-primary flex-grow-1">Sign in to book</a><a th:if="${session.currentUser?.role == 'ADMIN'}" th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil"></i></a><form th:if="${session.currentUser?.role == 'ADMIN'}" th:action="@{/doctors/delete/{id}(id=${doctor.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this doctor?')"><button class="btn btn-outline-danger"><i class="bi bi-trash"></i></button></form></div></div></div></div><div th:if="${doctors == null or doctors.isEmpty()}" class="surface empty-state"><div class="empty-icon"><i class="bi bi-person-x"></i></div><h5>No doctors available</h5><p>Please check back later.</p></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
