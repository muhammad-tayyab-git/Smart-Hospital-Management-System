<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="fragments/header :: header"></div><main class="container py-5"><div class="card border-0 shadow rounded-4"><div class="card-body p-4"><h2 class="mb-4" th:text="${doctor.id != null ? 'Edit Doctor' : 'Add Doctor'}"></h2><form th:action="${doctor.id != null ? '/doctors/updateDoctor/' + doctor.id : '/doctors/addDoctor'}" method="post"><div class="row"><div class="col-md-6 mb-3"><label>First name</label><input name="firstName" class="form-control" th:value="${user.firstName}" required></div><div class="col-md-6 mb-3"><label>Last name</label><input name="lastName" class="form-control" th:value="${user.lastName}" required></div><div class="col-md-6 mb-3"><label>Email</label><input type="email" name="email" class="form-control" th:value="${user.email}" required></div><div class="col-md-6 mb-3"><label>Password</label><input type="password" name="password" class="form-control" th:placeholder="${doctor.id != null ? 'Leave blank to keep current password' : ''}" th:required="${doctor.id == null}"></div><div class="col-md-6 mb-3"><label>Specialization</label><input name="specialization" class="form-control" th:value="${doctor.specialization}" required></div><div class="col-md-6 mb-3"><label>Experience (years)</label><input type="number" name="experienceYears" class="form-control" th:value="${doctor.experienceYears}" min="0"></div><div class="col-md-6 mb-3"><label>Department</label><select name="departmentId" class="form-select" required><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${doctor.department != null and doctor.department.id == d.id}"></option></select></div><div class="col-md-6 mb-3"><label>Active</label><select name="active" class="form-select"><option value="true" th:selected="${doctor.active}">Active</option><option value="false" th:selected="${!doctor.active}">Inactive</option></select></div></div><button class="btn btn-primary">Save</button> <a th:href="@{/doctors}" class="btn btn-secondary">Cancel</a></form></div></div></main></body></html>
