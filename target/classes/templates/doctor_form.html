<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doctor | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/admin-header :: adminLayout"></div><main class="admin-content"><div class="page-header"><div><span class="eyebrow">Medical team</span><h1 class="page-title" th:text="${doctor.id != null ? 'Edit doctor' : 'Add doctor'}">Add doctor</h1><p class="page-subtitle">Create a staff account and associate it with a hospital department.</p></div><a th:href="@{/doctors}" class="btn btn-light border"><i class="bi bi-arrow-left me-2"></i>Back</a></div><form th:action="${doctor.id != null ? '/doctors/updateDoctor/' + doctor.id : '/doctors/addDoctor'}" method="post"><div class="row g-4"><div class="col-lg-7"><div class="surface surface-body"><div class="card-heading"><div><span class="section-kicker">Identity</span><h4>Doctor account</h4></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label">First name *</label><input name="firstName" class="form-control" th:value="${user.firstName}" required></div><div class="col-md-6"><label class="form-label">Last name *</label><input name="lastName" class="form-control" th:value="${user.lastName}" required></div><div class="col-md-6"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" th:value="${user.email}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" th:value="${user.phone}"></div><div class="col-12"><label class="form-label">Password</label><input type="password" name="password" class="form-control" th:placeholder="${doctor.id != null ? 'Leave blank to keep current password' : 'Set a password'}" th:required="${doctor.id == null}"></div></div></div></div><div class="col-lg-5"><div class="surface surface-body"><div class="card-heading"><div><span class="section-kicker">Professional</span><h4>Doctor profile</h4></div></div><div class="mb-3"><label class="form-label">Specialization *</label><input name="specialization" class="form-control" th:value="${doctor.specialization}" required></div><div class="mb-3"><label class="form-label">Experience (years)</label><input type="number" name="experienceYears" class="form-control" th:value="${doctor.experienceYears}" min="0"></div><div class="mb-3"><label class="form-label">Department *</label><select name="departmentId" class="form-select" required><option value="">Select department</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${doctor.department != null and doctor.department.id == d.id}"></option></select></div><div><label class="form-label">Status</label><select name="active" class="form-select"><option value="true" th:selected="${doctor.active}">Active</option><option value="false" th:selected="${!doctor.active}">Inactive</option></select></div></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a th:href="@{/doctors}" class="btn btn-light border">Cancel</a><button class="btn btn-primary"><i class="bi bi-check2 me-2"></i>Save doctor</button></div></form></main></body></html>
