<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Appointment</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="fragments/header :: header"></div><main class="container py-5"><h2 class="text-center text-primary mb-4">Book with <span th:text="${doctor.fullName}">Doctor</span></h2><form method="get" th:action="@{/appointments/book}" class="row g-2 justify-content-center mb-4"><input type="hidden" name="doctorId" th:value="${doctor.id}"><div class="col-auto"><input type="date" name="date" th:value="${selectedDate}" class="form-control" required></div><div class="col-auto"><button class="btn btn-primary">View available times</button></div></form><div th:if="${error}" class="alert alert-warning" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="card-body"><div th:if="${#lists.isEmpty(slots)}" class="text-center text-muted py-4">No available slots for this date.</div><div th:unless="${#lists.isEmpty(slots)}" class="table-responsive"><table class="table align-middle"><thead><tr><th>Start</th><th>End</th><th></th></tr></thead><tbody><tr th:each="slot:${slots}"><td th:text="${slot.startTime}"></td><td th:text="${slot.endTime}"></td><td class="text-end"><form th:action="@{/appointments/bookSlot}" method="post"><input type="hidden" name="doctorId" th:value="${slot.doctorId}"><input type="hidden" name="date" th:value="${slot.date}"><input type="hidden" name="startTime" th:value="${slot.startTime}"><input type="hidden" name="endTime" th:value="${slot.endTime}"><button class="btn btn-success btn-sm">Book</button></form></td></tr></tbody></table></div></div></div></main></body></html>
