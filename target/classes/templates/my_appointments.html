<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Appointments | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">Patient portal</span><h1 class="page-title">My appointments</h1><p class="page-subtitle">Review upcoming and previous appointments.</p></div><a th:href="@{/doctors}" class="btn btn-primary"><i class="bi bi-calendar2-plus me-2"></i>Book appointment</a></div><div class="surface table-shell"><div th:if="${#lists.isEmpty(appointments)}" class="empty-state"><div class="empty-icon"><i class="bi bi-calendar2-x"></i></div><h5>No appointments yet</h5><p>Choose a doctor to schedule your first appointment.</p><a th:href="@{/doctors}" class="btn btn-primary">Find a doctor</a></div><div th:unless="${#lists.isEmpty(appointments)}" class="table-responsive"><table class="table"><thead><tr><th>Doctor</th><th>Date</th><th>Time</th><th>Type</th><th>Status</th><th class="text-end">Action</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td><div class="person-cell"><span class="person-avatar"><i class="bi bi-person-badge"></i></span><div><div class="person-name" th:text="${a.doctor.fullName}">Doctor</div><div class="person-meta" th:text="${a.doctor.specialization}">Specialization</div></div></div></td><td th:text="${#temporals.format(a.date,'dd MMM yyyy')}">Date</td><td th:text="${a.startTime + ' – ' + a.endTime}">Time</td><td th:text="${a.appointmentType}">CONSULTATION</td><td><span class="status-pill success" th:if="${a.status == T(com.shms.entity.Appointment.AppointmentStatus).CONFIRMED}">Confirmed</span><span class="status-pill info" th:if="${a.status == T(com.shms.entity.Appointment.AppointmentStatus).REQUESTED}">Requested</span><span class="status-pill success" th:if="${a.status == T(com.shms.entity.Appointment.AppointmentStatus).COMPLETED}">Completed</span><span class="status-pill danger" th:if="${a.status == T(com.shms.entity.Appointment.AppointmentStatus).CANCELLED}">Cancelled</span><span class="status-pill warning" th:if="${a.status == T(com.shms.entity.Appointment.AppointmentStatus).NO_SHOW}">No show</span></td><td class="text-end"><form th:if="${a.status != T(com.shms.entity.Appointment.AppointmentStatus).CANCELLED and a.status != T(com.shms.entity.Appointment.AppointmentStatus).COMPLETED}" th:action="@{/appointments/cancel/{id}(id=${a.id})}" method="post" onsubmit="return confirm('Cancel this appointment?')"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-x-circle me-1"></i>Cancel</button></form></td></tr></tbody></table></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
