<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Management | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/admin-header :: adminLayout"></div><main class="admin-content"><div class="page-header"><div><span class="eyebrow">Administration</span><h1 class="page-title">Staff management</h1><p class="page-subtitle">Create hospital staff accounts. Patients must use public registration.</p></div></div><div class="row g-4"><div class="col-xl-7"><div class="admin-card"><div class="card-heading"><div><span class="section-kicker">New account</span><h4 class="mt-1">Create staff member</h4></div></div><form th:action="@{/admin/staff}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name *</label><input name="firstName" class="form-control" required></div><div class="col-md-6"><label class="form-label">Last name *</label><input name="lastName" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" required></div><div class="col-md-6"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" minlength="8" required></div><div class="col-md-6"><label class="form-label">Role *</label><select id="staffRole" name="role" class="form-select" required><option value="">Select role</option><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div><div class="col-md-6" id="departmentField"><label class="form-label">Department</label><select name="departmentId" class="form-select"><option value="">Select department</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}"></option></select></div><div class="col-md-6" id="specializationField"><label class="form-label">Specialization</label><input name="specialization" class="form-control"></div><div class="col-md-6" id="qualificationField"><label class="form-label">Qualification</label><input name="qualification" class="form-control"></div><div class="col-md-6" id="licenseField"><label class="form-label">License number</label><input name="licenseNumber" class="form-control"></div><div class="col-md-6" id="experienceField"><label class="form-label">Experience (years)</label><input type="number" min="0" name="experienceYears" class="form-control"></div><div class="col-12"><button class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Create staff account</button></div></div></form></div></div><div class="col-xl-5"><div class="admin-card h-100"><div class="card-heading"><div><span class="section-kicker">Current team</span><h4 class="mt-1">Staff accounts</h4></div></div><div class="list-stack"><div th:each="u:${staffUsers}" class="appointment-row"><div class="person-avatar"><i class="bi bi-person-badge"></i></div><div class="flex-grow-1"><strong th:text="${u.fullName}">Staff</strong><small th:text="${u.email}">email</small></div><span class="status-pill info" th:text="${u.role}">ROLE</span></div><div th:if="${staffUsers.isEmpty()}" class="empty-state py-4"><p>No staff accounts found.</p></div></div></div></div></div></main><script>const role=document.getElementById('staffRole');const doctorFields=['departmentField','specializationField','qualificationField','licenseField','experienceField'];function toggleDoctorFields(){const on=role&&role.value==='DOCTOR';doctorFields.forEach(id=>document.getElementById(id).style.display=on?'block':'none')}role?.addEventListener('change',toggleDoctorFields);toggleDoctorFields();</script></body></html>
