<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinical Visit | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">DOCTOR WORKSPACE</span><h1 class="page-title">Clinical visit</h1><p class="page-subtitle"><strong th:text="${appointment.patient.fullName}">Patient</strong> · <span th:text="${appointment.appointmentNumber}">APT</span></p></div><a href="/doctors/dashboard" class="btn btn-outline-primary">Back to schedule</a></div>
<div class="row g-4"><div class="col-lg-8"><div class="surface"><div class="surface-body"><div class="card-heading"><div><span class="section-kicker">Medical record</span><h4>Consultation notes</h4></div></div><form method="post"><div class="row g-3"><div class="col-12"><label class="form-label">Chief complaint</label><input name="complaint" class="form-control" th:value="${record.chiefComplaint}"></div><div class="col-12"><label class="form-label">Symptoms</label><textarea name="symptoms" class="form-control" rows="3" th:text="${record.symptoms}"></textarea></div><div class="col-12"><label class="form-label">Clinical notes</label><textarea name="notes" class="form-control" rows="4" th:text="${record.clinicalNotes}"></textarea></div><div class="col-12"><label class="form-label">Diagnosis summary</label><textarea name="diagnosis" class="form-control" rows="3" th:text="${record.diagnosisSummary}"></textarea></div><div class="col-12"><label class="form-label">Treatment plan</label><textarea name="treatment" class="form-control" rows="3" th:text="${record.treatmentPlan}"></textarea></div><div class="col-md-6"><label class="form-label">Follow-up date</label><input type="date" name="followUp" class="form-control" th:value="${record.followUpDate}"></div><div class="col-12"><button class="btn btn-primary"><i class="bi bi-save me-2"></i>Save clinical record</button></div></div></form></div></div></div>
<div class="col-lg-4"><div class="surface mb-4"><div class="surface-body"><div class="card-heading"><div><span class="section-kicker">Diagnostics</span><h4>Order lab test</h4></div></div><form method="post" th:action="@{/doctors/appointment/{id}/lab(id=${appointment.id})}"><label class="form-label">Test name</label><input name="testName" class="form-control mb-3" required placeholder="e.g. CBC"><label class="form-label">Priority</label><select name="priority" class="form-select mb-3"><option>NORMAL</option><option>URGENT</option><option>STAT</option></select><button class="btn btn-outline-primary w-100">Create lab order</button></form></div></div>
<div class="surface"><div class="surface-body"><span class="section-kicker">Visit status</span><h4 class="mt-1">Ready for billing</h4><p class="small text-muted">Complete the appointment from your dashboard to generate the consultation invoice.</p><a href="/doctors/dashboard" class="btn btn-success w-100">Return to appointments</a></div></div></div></div></div></main></body></html>
