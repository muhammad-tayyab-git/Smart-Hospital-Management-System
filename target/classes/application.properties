# Smart Hospital Management System - environment-based configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:shms_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Enable after Flyway migration scripts are added for the production schema.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
