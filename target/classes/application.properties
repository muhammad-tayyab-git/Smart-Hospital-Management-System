# Smart Hospital Management System - environment-based configuration
spring.application.name=smart-hospital-management-system

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:shms_user}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway. Hibernate validates the mapped model only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing V2 schema baseline
spring.flyway.validate-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Server / deployment
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Session security
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Health / observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=false

# Application demo data is already represented in the Flyway seed migration.
app.demo-data.enabled=false
