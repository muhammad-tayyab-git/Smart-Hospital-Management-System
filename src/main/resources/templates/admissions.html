<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admissions | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">HOSPITAL OPERATIONS</span><h1 class="page-title">Admissions & beds</h1><p class="page-subtitle">Monitor wards, bed availability and active admissions.</p></div></div><div class="row g-4"><div class="col-lg-7"><div class="surface"><div class="surface-body"><div class="card-heading"><div><span class="section-kicker">Capacity</span><h4>Bed inventory</h4></div></div><div class="row g-3"><div class="col-sm-6 col-lg-4" th:each="b:${beds}"><div class="quick-card"><div class="d-flex justify-content-between"><span class="quick-icon"><i class="bi bi-hospital"></i></span><span class="status-pill" th:text="${b.status}">AVAILABLE</span></div><h5 th:text="${b.bedNumber}">B-01</h5><p th:text="${b.ward.name}">Ward</p></div></div></div></div></div></div><div class="col-lg-5"><div class="surface"><div class="surface-body"><div class="card-heading"><div><span class="section-kicker">Patients</span><h4>Admissions</h4></div></div><div class="list-stack" th:each="a:${admissions}"><div class="list-row"><div><strong th:text="${a.patient.fullName}">Patient</strong><div class="small text-muted" th:text="${a.admissionNumber}">ADM</div></div><span class="status-pill warning" th:text="${a.status}">ADMITTED</span></div></div></div></div></div></div></div></main></body></html>
