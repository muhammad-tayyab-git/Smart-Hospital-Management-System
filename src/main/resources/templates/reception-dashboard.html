<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reception Dashboard | Smart Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container py-4 py-lg-5">
    <div class="hero-panel mb-4">
        <div><span class="eyebrow">RECEPTION DESK</span><h1 class="display-6 fw-bold">Good day, <span th:text="${user.username}">Reception</span></h1><p class="mb-0 text-white-50">Keep appointments, patients and billing moving smoothly.</p></div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="metric-card"><span>Doctors</span><strong th:text="${doctorsCount}">0</strong><i class="bi bi-person-badge"></i></div></div>
        <div class="col-md-4"><div class="metric-card"><span>Patients</span><strong th:text="${patientsCount}">0</strong><i class="bi bi-people"></i></div></div>
        <div class="col-md-4"><div class="metric-card"><span>Bills</span><strong th:text="${billsCount}">0</strong><i class="bi bi-receipt"></i></div></div>
    </div>

    <div class="row g-4">
        <div class="col-md-4"><a class="quick-card" th:href="@{/patients}"><i class="bi bi-person-plus"></i><h5>Patient desk</h5><p>Register and manage patient records.</p></a></div>
        <div class="col-md-4"><a class="quick-card" th:href="@{/doctors}"><i class="bi bi-calendar2-heart"></i><h5>Doctors</h5><p>Browse doctors and available services.</p></a></div>
        <div class="col-md-4"><a class="quick-card" th:href="@{/billing/listBills}"><i class="bi bi-credit-card"></i><h5>Billing</h5><p>Review invoices and payment status.</p></a></div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
