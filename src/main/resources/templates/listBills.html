<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Billing | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:if="${session.currentUser?.role == 'ADMIN'}" th:replace="fragments/admin-header :: adminLayout"></div><div th:unless="${session.currentUser?.role == 'ADMIN'}" th:replace="fragments/header :: header"></div><main th:class="${session.currentUser?.role == 'ADMIN'} ? 'admin-content' : 'page-main'"><div th:class="${session.currentUser?.role == 'ADMIN'} ? '' : 'page-container'"><div class="page-header"><div><span class="eyebrow">Finance</span><h1 class="page-title">Invoices</h1><p class="page-subtitle">Search invoices and review payment status.</p></div></div><div class="surface surface-body mb-4"><form method="get" th:action="@{/billing/listBills}" class="row g-3 align-items-end"><div class="col-lg-7"><label class="form-label">Search</label><input name="keyword" class="form-control" th:value="${keyword}" placeholder="Invoice number, patient name or status"></div><div class="col-lg-3"><label class="form-label">Status</label><select name="status" class="form-select"><option value="">All statuses</option><option value="DRAFT" th:selected="${status == 'DRAFT'}">Draft</option><option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option><option value="PARTIALLY_PAID" th:selected="${status == 'PARTIALLY_PAID'}">Partially paid</option><option value="PAID" th:selected="${status == 'PAID'}">Paid</option><option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option><option value="OVERDUE" th:selected="${status == 'OVERDUE'}">Overdue</option></select></div><div class="col-lg-2 d-flex gap-2"><button class="btn btn-primary flex-grow-1"><i class="bi bi-funnel me-1"></i>Filter</button><a th:href="@{/billing/listBills}" class="btn btn-light border"><i class="bi bi-arrow-counterclockwise"></i></a></div></form></div><div class="surface table-shell"><div th:if="${bills == null or bills.isEmpty()}" class="empty-state"><div class="empty-icon"><i class="bi bi-receipt"></i></div><h5>No invoices found</h5><p>Try changing your search or filters.</p></div><div th:unless="${bills == null or bills.isEmpty()}" class="table-responsive"><table class="table"><thead><tr><th>Invoice</th><th>Patient</th><th>Doctor</th><th>Total</th><th>Status</th><th>Issue date</th><th class="text-end">View</th></tr></thead><tbody><tr th:each="bill : ${bills}"><td><strong th:text="${bill.invoiceNumber}">INV</strong></td><td th:text="${bill.patient.fullName}">Patient</td><td th:text="${bill.appointment != null ? bill.appointment.doctor.fullName : '—'}">Doctor</td><td><strong th:text="${bill.totalAmount + ' €'}">0 €</strong></td><td><span class="status-pill success" th:if="${bill.status.name() == 'PAID'}">Paid</span><span class="status-pill warning" th:if="${bill.status.name() == 'PENDING' or bill.status.name() == 'PARTIALLY_PAID'}" th:text="${bill.status}">Pending</span><span class="status-pill danger" th:if="${bill.status.name() == 'CANCELLED' or bill.status.name() == 'OVERDUE'}" th:text="${bill.status}">Cancelled</span><span class="status-pill info" th:if="${bill.status.name() == 'DRAFT'}">Draft</span></td><td th:text="${#temporals.format(bill.issueDate,'dd MMM yyyy')}">Date</td><td class="text-end"><a th:href="@{/billing/view/{id}(id=${bill.id})}" class="btn btn-sm btn-light border"><i class="bi bi-arrow-up-right"></i></a></td></tr></tbody></table></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
