<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">Account</span><h1 class="page-title">My profile</h1><p class="page-subtitle">Update your personal information and account password.</p></div></div><div class="row g-4"><div class="col-lg-8"><div class="surface surface-body"><form th:action="@{/profile}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input name="firstName" class="form-control" th:value="${user.firstName}" required></div><div class="col-md-6"><label class="form-label">Last name</label><input name="lastName" class="form-control" th:value="${user.lastName}" required></div><div class="col-12"><label class="form-label">Email</label><input class="form-control" th:value="${user.email}" disabled></div><div class="col-12"><label class="form-label">Phone</label><input name="phone" class="form-control" th:value="${user.phone}"></div><div class="col-12"><hr></div><div class="col-12"><label class="form-label">New password</label><input type="password" name="newPassword" class="form-control" minlength="8" placeholder="Leave blank to keep your current password"></div><div class="col-12"><button class="btn btn-primary"><i class="bi bi-check2 me-2"></i>Save changes</button></div></div></form></div></div><div class="col-lg-4"><div class="surface surface-body"><div class="person-avatar mb-3" style="width:60px;height:60px;border-radius:18px"><i class="bi bi-person"></i></div><h4 class="fw-bold" th:text="${user.fullName}">User</h4><p class="text-muted mb-2" th:text="${user.email}">email</p><span class="status-pill info" th:text="${user.role}">ROLE</span><hr><small class="text-muted">Account status</small><div class="fw-bold mt-1" th:text="${user.status}">ACTIVE</div></div></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
