<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="container py-5"><div class="p-4 p-md-5 rounded-4 bg-primary text-white shadow"><small class="text-uppercase">Staff Portal</small><h1 class="fw-bold mt-2">Welcome, <span th:text="${user.fullName}">Staff</span></h1><p class="mb-0" th:text="${user.role}">Role</p></div><div class="row g-4 mt-1"><div class="col-md-4"><div class="card border-0 shadow-sm h-100"><div class="card-body"><h5>Patients</h5><p class="text-muted">Patient workflows will be available according to your role permissions.</p></div></div></div><div class="col-md-4"><div class="card border-0 shadow-sm h-100"><div class="card-body"><h5>Notifications</h5><p class="text-muted">Your role-specific notifications will appear here.</p></div></div></div><div class="col-md-4"><div class="card border-0 shadow-sm h-100"><div class="card-body"><h5>Hospital tasks</h5><p class="text-muted">This dashboard is the foundation for nurse, pharmacy and laboratory workflows.</p></div></div></div></div></main></body></html>
