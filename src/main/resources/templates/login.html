<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-6"><div class="card border-0 shadow-lg rounded-4"><div class="card-body p-4 p-md-5"><h2 class="fw-bold">Welcome back</h2><p class="text-muted">Sign in with your email address.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control form-control-lg" th:value="${email}" required autofocus></div><div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control form-control-lg" required></div><button class="btn btn-primary btn-lg w-100">Sign in</button></form><div class="alert alert-light border mt-4"><strong>Local demo:</strong><br>admin@smarthospital.local<br>doctor.sarah@smarthospital.local<br>patient.john@example.com<br><small>Password: Password123!</small></div><p class="text-center mt-4 mb-0">New patient? <a th:href="@{/register}">Create an account</a></p></div></div></div></div></main></body></html>
