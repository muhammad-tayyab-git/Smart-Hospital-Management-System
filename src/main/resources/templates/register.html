<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create patient account | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="container py-4"><div class="row justify-content-center"><div class="col-xl-9"><div class="auth-card"><div class="auth-form"><div class="d-flex justify-content-between align-items-start mb-4"><div><span class="section-kicker">Patient registration</span><h1 class="fw-bold mt-2 mb-1">Create your account</h1><p class="text-muted mb-0">Only patient accounts can be created through public registration.</p></div><a th:href="@{/home}" class="btn btn-light border"><i class="bi bi-x-lg"></i></a></div><div th:if="${error}" class="alert alert-danger border-0" th:text="${error}"></div><form th:action="@{/register}" method="post"><div class="surface p-3 p-md-4 mb-4" style="box-shadow:none"><h5 class="fw-bold mb-3"><i class="bi bi-person me-2 text-primary"></i>Account information</h5><div class="row g-3"><div class="col-md-6"><label class="form-label">First name *</label><input name="firstName" class="form-control" required></div><div class="col-md-6"><label class="form-label">Last name *</label><input name="lastName" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" autocomplete="email" required></div><div class="col-md-6"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" minlength="8" autocomplete="new-password" required></div><div class="col-12"><label class="form-label">Phone</label><input name="phone" class="form-control"></div></div></div><div class="surface p-3 p-md-4 mb-4" style="box-shadow:none"><h5 class="fw-bold mb-3"><i class="bi bi-clipboard2-pulse me-2 text-primary"></i>Optional health information</h5><div class="row g-3"><div class="col-md-6"><label class="form-label">Date of birth</label><input type="date" name="dateOfBirth" class="form-control"></div><div class="col-md-6"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">Prefer not to say</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option><option value="PREFER_NOT_TO_SAY">Prefer not to say</option></select></div><div class="col-md-6"><label class="form-label">Blood group</label><select name="bloodGroup" class="form-select"><option value="">Select</option><option value="A_POSITIVE">A+</option><option value="A_NEGATIVE">A-</option><option value="B_POSITIVE">B+</option><option value="B_NEGATIVE">B-</option><option value="AB_POSITIVE">AB+</option><option value="AB_NEGATIVE">AB-</option><option value="O_POSITIVE">O+</option><option value="O_NEGATIVE">O-</option></select></div><div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="3"></textarea></div></div></div><button class="btn btn-primary btn-lg w-100"><i class="bi bi-person-plus me-2"></i>Create patient account</button></form><p class="text-center mt-4 mb-0 text-muted">Already registered? <a th:href="@{/login}" class="fw-bold">Sign in</a></p></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
