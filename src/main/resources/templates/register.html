<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Registration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-xl-8"><div class="card border-0 shadow-lg rounded-4"><div class="card-body p-4 p-md-5"><h2 class="fw-bold text-primary">Create patient account</h2><p class="text-muted">Only patients can self-register. Staff accounts are created by an administrator.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/register}" method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">First name *</label><input name="firstName" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Last name *</label><input name="lastName" class="form-control" required></div></div><div class="mb-3"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" required></div><div class="mb-3"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" minlength="8" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control"></div><div class="col-md-6 mb-3"><label class="form-label">Date of birth</label><input type="date" name="dateOfBirth" class="form-control"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">Prefer not to say</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option><option value="PREFER_NOT_TO_SAY">Prefer not to say</option></select></div><div class="col-md-6 mb-3"><label class="form-label">Blood group</label><select name="bloodGroup" class="form-select"><option value="">Select</option><option value="A_POSITIVE">A+</option><option value="A_NEGATIVE">A-</option><option value="B_POSITIVE">B+</option><option value="B_NEGATIVE">B-</option><option value="AB_POSITIVE">AB+</option><option value="AB_NEGATIVE">AB-</option><option value="O_POSITIVE">O+</option><option value="O_NEGATIVE">O-</option></select></div></div><div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div><button class="btn btn-primary w-100 btn-lg">Create patient account</button></form><p class="text-center mt-4 mb-0">Already registered? <a th:href="@{/login}">Sign in</a></p></div></div></div></div></main></body></html>
