<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">COMMUNICATIONS</span><h1 class="page-title">Notifications</h1><p class="page-subtitle">Appointment, billing and laboratory updates.</p></div></div><div class="surface"><div class="surface-body"><div th:if="${notifications.empty}" class="empty-state">You're all caught up.</div><div class="notification-list" th:unless="${notifications.empty}" th:each="n:${notifications}"><div class="notification-item" th:classappend="${!n.read?'unread':''}"><div class="notification-icon"><i class="bi bi-bell"></i></div><div class="flex-grow-1"><strong th:text="${n.title}">Notification</strong><p class="mb-1 text-muted" th:text="${n.message}">Message</p><small class="text-muted" th:text="${#temporals.format(n.createdAt,'dd MMM yyyy HH:mm')}">Today</small></div><form th:if="${!n.read}" method="post" th:action="@{/notifications/{id}/read(id=${n.id})}"><button class="btn btn-sm btn-outline-primary">Mark read</button></form></div></div></div></div></div></main></body></html>
