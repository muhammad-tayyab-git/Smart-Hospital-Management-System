<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Bootstrap Icons -->
<body>

<div th:fragment="adminLayout">



    <!-- Sidebar -->
    <div id="sidebar">
        <h4 class="text-center mb-4">🏥 Smart Hospital</h4>
        <nav class="nav flex-column px-2">
            <a th:href="@{/admin-dashboard}"
               th:classappend="${currentUri != null and currentUri == '/admin-dashboard'} ? ' active'"
               class="nav-link">
                <i class="bi bi-speedometer2"></i><span> Dashboard</span>
            </a>
            <a th:href="@{/doctors}"
               th:classappend="${currentUri != null and currentUri.startsWith('/doctors')} ? ' active'"
               class="nav-link">
                <i class="bi bi-person-badge"></i><span> Doctors</span>
            </a>
            <a th:href="@{/patients}"
               th:classappend="${currentUri != null and currentUri.startsWith('/patients')} ? ' active'"
               class="nav-link">
                <i class="bi bi-people-fill"></i><span> Patients</span>
            </a>
            <a th:href="@{/billing/listBills}"
               th:classappend="${currentUri != null and currentUri.startsWith('/billing')} ? ' active'"
               class="nav-link">
                <i class="bi bi-receipt"></i><span> Billing</span>
            </a>
        </nav>


    </div>

    <!-- Top navbar -->
    <div id="top-navbar">
        <div>
            <button id="sidebarToggle" class="btn btn-outline-secondary btn-sm me-2">☰</button>
            <button id="darkModeToggle" class="btn btn-outline-secondary btn-sm">🌙 Dark Mode</button>
        </div>

        <div class="d-flex align-items-center">
            <!-- notifications -->
            <div class="nav-item dropdown me-3">
                <a class="nav-link position-relative" href="#" data-bs-toggle="dropdown">
                    <i class="bi bi-bell fs-4"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">9+</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">

                    <li th:each="a : ${activities}" class="dropdown-item">
                        <div class="ms-2 me-auto">
                            <div class="fw-bold" th:text="${a.description}"></div>
                            <small th:text="${#temporals.format(a.timestamp, 'dd MMM yyyy HH:mm')}"></small>
                        </div>
                        <span class="badge bg-primary rounded-pill" th:text="${a.user}"></span>
                    </li>
                </ul>
            </div>

            <!-- profile -->
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle fs-4 me-2"></i> Admin
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </div>
