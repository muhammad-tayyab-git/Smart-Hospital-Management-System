<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Appointment | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="fragments/header :: header"></div><main class="page-main"><div class="page-container"><div class="page-header"><div><span class="eyebrow">Appointment booking</span><h1 class="page-title">Book with <span th:text="${doctor.fullName}">Doctor</span></h1><p class="page-subtitle" th:text="${doctor.specialization + ' · ' + doctor.department.name}">Specialization</p></div><a th:href="@{/doctors}" class="btn btn-light border"><i class="bi bi-arrow-left me-2"></i>Doctors</a></div><div class="row g-4"><div class="col-lg-4"><div class="surface surface-body"><span class="section-kicker">Choose date</span><h4 class="fw-bold mt-2">Find an available time</h4><p class="text-muted small">Available slots are calculated from the doctor's schedule and existing appointments.</p><form method="get" th:action="@{/appointments/book}" class="mt-4"><input type="hidden" name="doctorId" th:value="${doctor.id}"><label class="form-label">Appointment date</label><input type="date" name="date" th:value="${selectedDate}" class="form-control mb-3" required><button class="btn btn-primary w-100"><i class="bi bi-search me-2"></i>Check availability</button></form><div th:if="${error}" class="alert alert-warning border-0 mt-3" th:text="${error}"></div></div></div><div class="col-lg-8"><div class="surface"><div class="surface-body"><div class="card-heading"><div><span class="section-kicker">Available slots</span><h4 class="mt-1">Select a time</h4></div><span class="status-pill info" th:text="${#temporals.format(selectedDate,'EEE, dd MMM yyyy')}">Date</span></div><div th:if="${#lists.isEmpty(slots)}" class="empty-state"><div class="empty-icon"><i class="bi bi-calendar2-x"></i></div><h5>No available slots</h5><p>Try another date.</p></div><div th:unless="${#lists.isEmpty(slots)}" class="row g-3"><div class="col-sm-6 col-xl-4" th:each="slot : ${slots}"><form th:action="@{/appointments/bookSlot}" method="post" class="h-100"><input type="hidden" name="doctorId" th:value="${slot.doctorId}"><input type="hidden" name="date" th:value="${slot.date}"><input type="hidden" name="startTime" th:value="${slot.startTime}"><input type="hidden" name="endTime" th:value="${slot.endTime}"><div class="w-100 h-100 text-start btn-light border p-3" style="border-radius:16px"><span class="d-block fw-bold fs-5" th:text="${slot.startTime + ' – ' + slot.endTime}">09:00 – 09:30</span><small class="text-muted d-block mb-3">Available</small><input name="reason" class="form-control form-control-sm mb-2" placeholder="Reason (optional)"><button class="btn btn-primary btn-sm w-100"><i class="bi bi-calendar2-check me-1"></i>Book this slot</button></div></form></div></div></div></div></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
