<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patients | Smart Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:if="${session.currentUser?.role == 'ADMIN'}" th:replace="fragments/admin-header :: adminLayout"></div><div th:unless="${session.currentUser?.role == 'ADMIN'}" th:replace="fragments/header :: header"></div><main th:class="${session.currentUser?.role == 'ADMIN'} ? 'admin-content' : 'page-main'"><div th:class="${session.currentUser?.role == 'ADMIN'} ? '' : 'page-container'"><div class="page-header"><div><span class="eyebrow">Patient management</span><h1 class="page-title">Patients</h1><p class="page-subtitle">Search and manage registered patient records.</p></div><a th:href="@{/patients/add}" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Add patient</a></div><div class="surface table-shell"><div th:if="${patients == null or patients.isEmpty()}" class="empty-state"><div class="empty-icon"><i class="bi bi-people"></i></div><h5>No patients found</h5><p>Start by registering a patient.</p></div><div th:unless="${patients == null or patients.isEmpty()}" class="table-responsive"><table class="table"><thead><tr><th>Patient</th><th>Patient no.</th><th>Age</th><th>Gender</th><th>Phone</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="p : ${patients}"><td><div class="person-cell"><span class="person-avatar"><i class="bi bi-person"></i></span><div><div class="person-name" th:text="${p.fullName}">Patient</div><div class="person-meta" th:text="${p.email}">email</div></div></div></td><td th:text="${p.patientNumber}">PAT-000001</td><td th:text="${p.age > 0 ? p.age : '—'}">—</td><td th:text="${p.gender != null ? p.gender : '—'}">—</td><td th:text="${p.phone != null ? p.phone : '—'}">—</td><td><span class="status-pill success" th:if="${p.status.name() == 'ACTIVE'}">Active</span><span class="status-pill danger" th:unless="${p.status.name() == 'ACTIVE'}">Inactive</span></td><td class="text-end"><a th:href="@{/patients/edit/{id}(id=${p.id})}" class="btn btn-sm btn-light border"><i class="bi bi-pencil"></i></a><form th:action="@{/patients/delete/{id}(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this patient?')"><button class="btn btn-sm btn-outline-danger ms-1"><i class="bi bi-trash"></i></button></form></td></tr></tbody></table></div></div></div></main><div th:replace="fragments/footer :: footer"></div></body></html>
