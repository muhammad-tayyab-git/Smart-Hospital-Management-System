<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="fragments/header :: header"></div><main class="container py-5"><div class="card border-0 shadow rounded-4"><div class="card-body p-4"><h2 class="mb-4" th:text="${patient.id != null ? 'Edit Patient' : 'Add Patient'}"></h2><form th:action="${patient.id != null ? '/patients/update/' + patient.id : '/patients/add'}" method="post"><div class="row"><div class="col-md-6 mb-3"><label>First name</label><input name="firstName" class="form-control" th:value="${user.firstName}" required></div><div class="col-md-6 mb-3"><label>Last name</label><input name="lastName" class="form-control" th:value="${user.lastName}" required></div><div class="col-md-6 mb-3"><label>Email</label><input type="email" name="email" class="form-control" th:value="${user.email}" required></div><div class="col-md-6 mb-3"><label>Password</label><input type="password" name="password" class="form-control" th:placeholder="${patient.id != null ? 'Leave blank to keep current password' : ''}" th:required="${patient.id == null}"></div><div class="col-md-6 mb-3"><label>Phone</label><input name="phone" class="form-control" th:value="${user.phone}"></div><div class="col-md-6 mb-3"><label>Date of birth</label><input type="date" name="dateOfBirth" class="form-control" th:value="${patient.dateOfBirth}"></div><div class="col-md-6 mb-3"><label>Gender</label><select name="gender" class="form-select"><option value="">Select</option><option value="MALE" th:selected="${patient.gender?.name() == 'MALE'}">Male</option><option value="FEMALE" th:selected="${patient.gender?.name() == 'FEMALE'}">Female</option><option value="OTHER" th:selected="${patient.gender?.name() == 'OTHER'}">Other</option><option value="PREFER_NOT_TO_SAY" th:selected="${patient.gender?.name() == 'PREFER_NOT_TO_SAY'}">Prefer not to say</option></select></div><div class="col-md-6 mb-3"><label>Blood group</label><select name="bloodGroup" class="form-select"><option value="">Select</option><option value="A_POSITIVE">A+</option><option value="A_NEGATIVE">A-</option><option value="B_POSITIVE">B+</option><option value="B_NEGATIVE">B-</option><option value="AB_POSITIVE">AB+</option><option value="AB_NEGATIVE">AB-</option><option value="O_POSITIVE">O+</option><option value="O_NEGATIVE">O-</option></select></div><div class="col-12 mb-3"><label>Address</label><textarea name="address" class="form-control" rows="2" th:text="${patient.address}"></textarea></div><div class="col-12 mb-3"><label>Allergies / medical notes</label><textarea name="allergies" class="form-control" rows="3" th:text="${patient.allergies}"></textarea></div></div><button class="btn btn-primary">Save</button> <a th:href="@{/patients}" class="btn btn-secondary">Cancel</a></form></div></div></main></body></html>
